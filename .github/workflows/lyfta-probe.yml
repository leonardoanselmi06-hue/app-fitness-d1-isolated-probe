name: Lyfta probe (manuale, solo struttura)
# SOLO workflow_dispatch. Legge l'API Lyfta in sola lettura con il secret LYFTA_API_KEY e stampa SOLO la struttura dei campi
# (repo pubblico: i log sono pubblici, quindi mai valori). Nessuna scrittura su D1/Drive/repo.
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: lyfta-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Test locali
        run: npm test
      - name: Probe struttura Lyfta (nessun valore nei log)
        env:
          LYFTA_API_KEY: ${{ secrets.LYFTA_API_KEY }}
        run: node scripts/lyfta-schema-probe.mjs
